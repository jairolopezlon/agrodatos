name = "agrodatos-worker-etl"
main = "src/index.ts"
compatibility_date = "2024-03-20"

[[d1_databases]]
binding = "DB"
database_name = "agrodatos"
database_id = "e348edb1-e8b0-486d-9f7f-c2f1dec7529d"

[vars]
PAGES_ORIGIN = "https://agrodatos.pages.dev"

# Configura SOCRATA_APP_TOKEN con: wrangler secret put SOCRATA_APP_TOKEN
# Configura ADMIN_API_KEY con: wrangler secret put ADMIN_API_KEY

[triggers]
# Cloudflare usa 1 = domingo (no 0); 03:00 UTC del domingo.
crons = ["0 3 * * 1"]
